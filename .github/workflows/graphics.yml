name: Refresh profile graphics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  graphics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVGs
        run: |
          python3 scripts/gen_heatmap.py
          python3 scripts/gen_stats.py
        env:
          # PROFILE_PAT (fine-grained, read-only) makes private repos count in
          # stats/langs; without it the built-in token sees public repos only.
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
          PYTHONPATH: scripts
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap-*.svg assets/stats-*.svg assets/langs-*.svg
          git diff --cached --quiet || { git commit -m "chore: refresh profile graphics"; git push; }
