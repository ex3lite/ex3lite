<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="about"><style>text{white-space:pre}</style><rect x="0.5" y="0.5" width="899" height="209" rx="14" fill="#0a0f15" stroke="#1c2833" stroke-width="1"/><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="34" font-size="12.5" fill="#5ef2a0">$ cat about</text><rect x="1" y="50" width="898" height="1" fill="#1c2833"/><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="82" font-size="13" fill="#5ef2a0">сейчас</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="120" y="82" font-size="13" fill="#8ba0ae">core engineer на AI-проекте — базовые сервисы и инфраструктура агентов</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="108" font-size="13" fill="#5ef2a0">также</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="120" y="108" font-size="13" fill="#8ba0ae">один из ведущих разработчиков VPN-проекта — Amnezia + Xray + WireGuard</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="134" font-size="13" fill="#5ef2a0">пишу</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="120" y="134" font-size="13" fill="#8ba0ae">MCP-серверы, которые дают LLM реальные возможности</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="160" font-size="13" fill="#5ef2a0">тулинг</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="120" y="160" font-size="13" fill="#8ba0ae">центры управления Claude Code, десктопные редакторы сессий</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="186" font-size="13" fill="#5ef2a0">копаю</text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="120" y="186" font-size="13" fill="#8ba0ae">системный дизайн, внутренности протоколов, защищённые сети</text></svg>