<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="about ex3lite"><style>text{white-space:pre}</style><rect x="0.5" y="0.5" width="899" height="155" rx="14" fill="#ffffff" stroke="#dbe3e2" stroke-width="1"/><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="34" font-size="12.5" fill="#0b8a58">$ man ex3lite</text><rect x="1" y="50" width="898" height="1" fill="#dbe3e2"/><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="82" font-size="13"><tspan fill="#08121a" font-weight="700">Core engineer.</tspan><tspan fill="#4a5d6b"> I build the parts products stand on — core services, protocol</tspan></text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="108" font-size="13"><tspan fill="#4a5d6b">internals and the integrations everything else plugs into: gRPC APIs, network</tspan></text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="134" font-size="13"><tspan fill="#4a5d6b">stacks, document pipelines and infrastructure for AI agents.</tspan></text></svg>