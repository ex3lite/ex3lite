<svg xmlns="http://www.w3.org/2000/svg" width="900" height="156" viewBox="0 0 900 156" role="img" aria-label="about ex3lite"><style>text{white-space:pre}</style><rect x="0.5" y="0.5" width="899" height="155" rx="14" fill="#0a0f15" stroke="#1c2833" stroke-width="1"/><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="34" font-size="12.5" fill="#5ef2a0">$ man ex3lite</text><rect x="1" y="50" width="898" height="1" fill="#1c2833"/><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="82" font-size="13"><tspan fill="#dce8f1" font-weight="700">Core engineer.</tspan><tspan fill="#8ba0ae"> Делаю то, на чём стоит продукт — базовые сервисы, внутренности</tspan></text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="108" font-size="13"><tspan fill="#8ba0ae">протоколов и интеграции, в которые включается всё остальное: gRPC API, сетевые</tspan></text><text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" x="24" y="134" font-size="13"><tspan fill="#8ba0ae">стеки, пайплайны документов и инфраструктура для AI-агентов.</tspan></text></svg>